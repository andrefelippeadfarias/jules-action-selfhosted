name: Jules Invoke
description: 'Invoke Jules, an AI-powered coding agent, to perform tasks on your codebase.'

branding:
  icon: 'code'
  color: 'purple'

inputs:
  ollama_host:
    description: "Ollama host URL (default http://127.0.0.1:11434)"
    required: false
    type: string
    default: http://127.0.0.1:11434
  ollama_model:
    description: "Modelo Ollama a ser usado (default kimi-k2.6:cloud)"
    required: false
    type: string
    default: kimi-k2.6:cloud
  prompt:
    description: 'The prompt to pass to Jules'
    required: true
    type: string
  include_last_commit:
    description: 'Whether to pass content of the last commit'
    type: boolean
    default: false
  include_commit_log:
    description: 'Whether to pass commit history'
    type: boolean
    default: false
  starting_branch:
    description: 'The branch for Jules to start from'
    required: false
    type: string
    default: 'main'


runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 30

    - name: Create initial prompt
      env:
        USER_PROMPT: ${{ inputs.prompt }}
      shell: bash
      run: |
        echo "$USER_PROMPT" > prompt.txt

    - name: Save last commit content
      if: ${{ inputs.include_last_commit }}
      shell: bash
      run: |
        echo -e '\n\nContent of the latest commit (in the format of `git show`):' >> prompt.txt
        echo '```' >> prompt.txt
        git show   >> prompt.txt
        echo '```' >> prompt.txt

    - name: Save git log
      if: ${{ inputs.include_commit_log }}
      shell: bash
      run: |
        echo -e '\n\nLog of the last 20 commits (in the format of `git log --stat`):' >> prompt.txt
        echo '```'         >> prompt.txt
        git log -20 --stat >> prompt.txt
        echo '```'         >> prompt.txt

    - name: Assemble Jules payload
      shell: bash
      run: |
        jq -n --arg jules_prompt "$(cat prompt.txt)" --arg starting_branch "${{ inputs.starting_branch }}" --arg repo_full_name "${{ github.repository }}" '{
            "prompt": $jules_prompt,
            "sourceContext": {
              "source": "sources/github/\($repo_full_name)",
              "githubRepoContext": {
                "startingBranch": $starting_branch
              }
            },
            "requirePlanApproval": false,
            "automationMode": "AUTO_CREATE_PR"
          }' > jules_payload.json

    - name: Invoke Ollama (Jules wrapper)
      env:
        OLLAMA_HOST: ${{ inputs.ollama_host }}
        OLLAMA_MODEL: ${{ inputs.ollama_model }}
      shell: bash
      run: |
        python3 scripts/jules_ollama.py prompt.txt

    - name: Create PR (optional)
      shell: bash
      run: |
        git commit -m "Jules: Generated changes" || true
        # Attempt to push and capture the PR URL if it is a self‑hosted runner
        PR_URL=$(git push origin juls-generated) || true
        echo "PR_URL=$PR_URL" >> $GITHUB_ENV

    - name: Report to Paperclip
      if: env.PR_URL != ''
      env:
        PR_URL: ${{ env.PR_URL }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PAPERCLIP_API_KEY: ${{ secrets.PAPERCLIP_API_KEY }}
        PAPERCLIP_URL: ${{ secrets.PAPERCLIP_URL }}
      shell: bash
      run: |
        python3 scripts/paperclip_report.py
